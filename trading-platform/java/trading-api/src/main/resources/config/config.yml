project:
  root: .
  config_dir: configs
  output_dir: outputs

output:
  file: outputs/predictions_tp_0503_1.xlsx
  schema: configs/col.yml

runtime:
  ttl_minutes: 240
  force_refresh: false
  use_dl: true
  use_ml: true
  use_rl: true
  symbol_limit: 0
  rebuild_training_history_on_every_run: false
  training_feature_file: python/model_service/training/raw_feature_history.csv
  logic_files:
    indicators: configs/indicators.yml
    patterns: configs/patterns.yml
    quant: configs/quant.yml
    substages: configs/substages.yml
    business_rules: configs/business-rules.yml
    agent_config: configs/agent-config.yml
    rank_config: configs/rank_config.json
    strong_buy_thresholds: configs/strong_buy_thresholds.json
    strong_buy_thresholds_proxy: configs/strong_buy_thresholds_15pct_45d_proxy.json
ibkr:
