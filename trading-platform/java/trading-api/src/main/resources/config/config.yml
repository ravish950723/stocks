  host: 127.0.0.1
  port: 7496
  client_id: 103
  history_years: 10
  incremental_overlap_days: 10
  min_candles_for_healthy_cache: 252
alpha_vantage:
  enabled: true
  api_key: R0CPMMZ44N4IJWAD
  base_url: https://www.alphavantage.co/query
  timeout_seconds: 10
  enrich_fundamentals: true
  enrich_news_sentiment: true
  use_as_candle_fallback: true
  enrich_only_top_n: 0
labels:
